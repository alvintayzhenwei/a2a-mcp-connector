[project]
name = "a2a-mcp-connector"
version = "0.1.0"
description = "Generic MCP server to stream-connect an AI agent to any standard A2A endpoint, with a built-in A2A validator"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alvin Tay", email = "alvintay@ecquaria.com" }]
keywords = ["mcp", "model-context-protocol", "a2a", "agent", "a2a-protocol", "connector", "validator"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
  "Development Status :: 4 - Beta",
]
# a2a-sdk pinned exactly (not >=), mirroring a2a-games / a2a-raid-mcp: this SDK
# has real API churn between minors — bump deliberately and re-verify the call
# shapes in a2a_client.py / validator.py against the new version, don't just relax it.
dependencies = ["mcp>=1.12", "a2a-sdk==1.1.0", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://lvntay.ai"
"A2A protocol games" = "https://lvntay.ai/hobby/a2a-protocol-games/"

[project.scripts]
a2a-mcp-connector = "a2a_mcp_connector.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2a_mcp_connector"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
