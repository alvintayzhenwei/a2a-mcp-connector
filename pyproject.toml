[project]
name = "a2a-mcp-connector"
version = "0.1.1"
description = "Generic MCP server to stream-connect an AI agent to any standard A2A endpoint, with a built-in A2A validator"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alvin Tay", email = "alvintay@ecquaria.com" }]
keywords = ["mcp", "model-context-protocol", "a2a", "agent", "a2a-protocol", "connector", "validator"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
  "Development Status :: 4 - Beta",
]
# a2a-sdk pinned exactly (not >=), mirroring a2a-games / a2a-raid-mcp: this SDK
# has real API churn between minors — bump deliberately and re-verify the call
# shapes in a2a_client.py / validator.py against the new version, don't just relax it.
#
# mcp is CAPPED BELOW 2 for the same reason — see the longer note in
# a2a-raid-mcp/pyproject.toml. `server.py` imports `mcp.server.fastmcp.FastMCP`,
# which mcp 2.0 renamed and deleted, so an open upper bound let `uvx
# a2a-mcp-connector` resolve mcp 2.1.1 and die at import. This package is the one
# the PHASE games (Odd One Out / Agent Arena) tell visitors to install, so it was
# broken in exactly the same way and for exactly as long.
dependencies = ["mcp>=1.12,<2", "a2a-sdk==1.1.0", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://lvntay.ai"
Source = "https://github.com/alvintayzhenwei/a2a-mcp-connector"
Issues = "https://github.com/alvintayzhenwei/a2a-mcp-connector/issues"
Changelog = "https://github.com/alvintayzhenwei/a2a-mcp-connector/blob/main/CHANGELOG.md"
"A2A protocol games" = "https://lvntay.ai/hobby/a2a-protocol-games/"

[project.scripts]
a2a-mcp-connector = "a2a_mcp_connector.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2a_mcp_connector"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
